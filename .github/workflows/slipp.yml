# The release to production (L1b, 11.11.2026; Jonas' valg 33 B the same day, after V1 A and V2 A of valg 16): main is moved straight
# forward to a commit of the working branch, and nothing else. No session may push to main (the deny list in .claude/settings.json),
# and neither the GitHub tool nor «Merge pull request» can fast-forward, so this does it: started by the work routine at night when
# its gate holds (tools/plan/RUTINE.md «Slippet»), by a session when Jonas says «slipp nå», or by Jonas from the Actions tab.
# It refuses: a commit that is not on the branch named, a move that is not a fast-forward, a branch other than the working branch
# or an urgent one from main (slipp/…), and a release that touches real money, accounts and saved player data, or src/legal/
# (tools/release/slipp.py finds that, with the lists of tools/ci/risiko.py) unless the release's pull request carries the label
# `jonas-har-sett`; that holds for an automatic fix alone too (slipp/auto-*), which must besides be of risk `lav` (18.11.2026). The label is
# taken off again after the release, so the next one that touches money waits for Jonas anew.
# The migrations the pull request lists must be out in the production before main moves: either run by hand before this is started
# («migreringer: kjørt»), or run here from the gate's server («migreringer: hetzner», live-drift fase 3, 18.11.2026; Jonas: «Kjør
# produksjonsmigreringene fra Hetzner-serveren i selve slippet»): the server fetches the SQL from GitHub at the commit, checks it with
# tools/ci/migsjekk.py (only expansion, safe to run twice) and runs it with the database URL only it has (tools/server/gate/migrer.py).
# A stop or no answer stops the release before main moves. The Edge Functions the pull request lists must still be out before.
# The push: with the deploy key in the secret SLIPP_KEY (an SSH deploy key with write access; Settings → Deploy keys) when it is set,
# else with the workflow's own token. The token may not push commits that change .github/workflows/ (GitHub refuses it), so a release
# with a workflow change needs the key; the step says so when it happens. A push with the token starts no workflow, so «Appen på
# Hetzner» is started here; a push with the key starts it by itself.
name: Slipp
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commiten main flyttes fram til (tom = toppen av grenen under)'
        required: false
        default: ''
      gren:
        description: 'Grenen commiten ligger på: arbeidsgrenen, eller en hastegren fra main (slipp/…)'
        required: false
        default: 'ccr-5e1ba2f4-pusvyd'
      migreringer:
        description: '«hetzner» (serveren kjører migreringene nå), «kjørt» (de er kjørt for hånd) eller «ingen»; Edge Functions må være ute'
        required: true
        default: ''
      tross_nodbrems:
        description: 'Står nødbremsen (https://detstorebla.no/nodbrems.json)? Bare Jonas skriver «ja» her, når han slipper rettingen selv'
        required: false
        default: ''
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: slipp
  cancel-in-progress: false
jobs:
  slipp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.gren }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hva som slippes
        id: what
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ inputs.commit }}
          GREN: ${{ inputs.gren }}
          MIG: ${{ inputs.migreringer }}
          TROSS: ${{ inputs.tross_nodbrems }}
        run: |
          case "$GREN" in ccr-5e1ba2f4-pusvyd|slipp/*) ;; *) echo "Bare arbeidsgrenen eller en hastegren (slipp/…) kan slippes: $GREN"; exit 1;; esac
          case "$MIG" in kjørt|ingen|hetzner) ;; *) echo "Skriv «hetzner», «kjørt» eller «ingen» i «migreringer»: de må være ute i produksjon før main flyttes."; exit 1;; esac
          # the emergency brake's lock (live-drift fase 4, tools/server/vakt/brems.py): no release while it answers, unless Jonas starts
          # this himself with «tross_nodbrems: ja» (the new edition he releases has no lock file, so the lock goes with it)
          if curl -fsS -o nodbrems.json "https://detstorebla.no/nodbrems.json?t=$(date +%s)" 2>/dev/null && [ "$TROSS" != ja ]; then
            echo "Nødbremsen står (https://detstorebla.no/nodbrems.json): $(head -c 400 nodbrems.json). Bare Jonas slipper nå, med «tross_nodbrems: ja»."; exit 1
          fi
          git fetch -q origin main
          if [ -n "$COMMIT" ]; then
            printf '%s' "$COMMIT" | grep -qE '^[0-9a-f]{7,40}$' || { echo "Ikke en commit: $COMMIT"; exit 1; }
            sha=$(git rev-parse --verify -q "$COMMIT^{commit}") || { echo "Ukjent commit: $COMMIT"; exit 1; }
          else sha=$(git rev-parse HEAD); fi
          git merge-base --is-ancestor "$sha" HEAD || { echo "$sha ligger ikke på $GREN."; exit 1; }
          if git merge-base --is-ancestor "$sha" origin/main; then echo "Ingenting å slippe: main har alt $sha."; exit 1; fi
          git merge-base --is-ancestor origin/main "$sha" || { echo "main kan ikke flyttes rett fram til $sha: main har commits grenen ikke har. Flett main inn i grenen først."; exit 1; }
          # an automatic fix alone (slipp/auto-<PR>, .github/workflows/autofix.yml, 16.11.2026): one commit on top of main, and of
          # risk `lav` by tools/ci/risiko.py (18.11.2026; Jonas: «Lavrisiko UI- og feilrettinger går automatisk til produksjon»). The
          # rules are read from the working branch, and from main as well once main has them (the stricter wins; a fix that changes
          # risiko.py is `hoy` itself, so it cannot loosen its own gate). Before 18.11.2026 this read ALLOW and DENY from main's gate.py,
          # which let real money and the save format through
          case "$GREN" in slipp/auto-*)
            [ "$(git rev-list --count origin/main.."$sha")" = 1 ] || { echo "En automatisk retting er én commit oppå main: $GREN har $(git rev-list --count origin/main.."$sha")."; exit 1; }
            W=ccr-5e1ba2f4-pusvyd; git fetch -q origin "$W"
            mkdir -p /tmp/rk && n=0
            for ref in "origin/$W" origin/main; do
              if git show "$ref:tools/ci/risiko.py" > "/tmp/rk/risiko_$n.py" 2>/dev/null; then n=$((n+1)); else rm -f "/tmp/rk/risiko_$n.py"; fi
            done
            [ "$n" -gt 0 ] || { echo "Fant ikke tools/ci/risiko.py på arbeidsgrenen: en automatisk retting slippes ikke uten risikoklassen."; exit 1; }
            for f in /tmp/rk/risiko_*.py; do
              k=$(python3 - "$f" "$sha" <<'PY'
          import importlib.util, sys
          sp = importlib.util.spec_from_file_location('risiko_x', sys.argv[1]); r = importlib.util.module_from_spec(sp); sp.loader.exec_module(r)
          res = r.from_git('origin/main', sys.argv[2], '.')
          print(res['klasse']); [print('  %s: %s' % (w['fil'], w['hvorfor']), file=sys.stderr) for w in res['grunner'][:10]]
          PY
              )
              [ "$k" = lav ] || { echo "En automatisk retting slippes bare alene når risikoen er lav (tools/ci/risiko.py): denne er «$k». Den venter på Jonas."; exit 1; }
            done
            ;; esac
          python3 tools/release/slipp.py --dry --json --no-fetch --offline --base origin/main --head "$sha" > slipp.txt
          tail -n 1 slipp.txt > slipp.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          d = json.load(open('slipp.json'))
          # real money, accounts and saved player data, and src/legal/ wait for Jonas, also in an automatic fix alone (18.11.2026; Jonas:
          # «Fjern unntaket som lar automatiske rettinger i ekte penger, Stripe og butikk slippes uten godkjenning». From 17.11.2026 to
          # 18.11.2026 a fix alone in real money went without the label)
          print('wait=%d' % (1 if d.get('legal') or d.get('money') or d.get('saves') else 0))
          print('marked=%s' % ((d.get('marked') or [''])[0]))
          print('nmig=%d' % len(d.get('migrations') or []))
          PY
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "old=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          git diff --name-only origin/main "$sha" -- .github/workflows | grep -q . && echo "wf=1" >> "$GITHUB_OUTPUT" || echo "wf=0" >> "$GITHUB_OUTPUT"
          pr=$(gh pr list --base main --head "$GREN" --state open --json number -q '.[0].number')
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          { echo "### Slipp: main $(git rev-parse --short origin/main) → $(git rev-parse --short "$sha") ($GREN)"; echo; sed -n '1,60p' slipp.txt | head -c 6000; } >> "$GITHUB_STEP_SUMMARY"
      # real money and the legal pages: never before Jonas has seen the pull request (CLAUDE.md). The label must be newer than the
      # newest commit that touches them, so one set for an earlier look does not let a later change through
      - name: Ekte penger, kontoer, lagringer og src/legal/ venter på Jonas
        if: steps.what.outputs.wait == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.what.outputs.pr }}
          MARKED: ${{ steps.what.outputs.marked }}
        run: |
          [ -n "$PR" ] || { echo "Slippet rører ekte penger, kontoer, lagret spillerdata eller src/legal/, og det finnes ingen åpen slipp-PR som Jonas kan ha sett (python3 tools/release/slipp.py lager den)."; exit 1; }
          # the label itself decides: GitHub's event lists for this pull request do not show when it was set (seen 11.11.2026: neither
          # issues/N/events nor the timeline has the event), so the time is not checked. It is taken off after every release
          # («Etterpå»), so each release that touches money needs it set anew
          has=$(gh pr view "$PR" --json labels -q '.labels[] | select(.name == "jonas-har-sett") | .name')
          echo "Merkelappen på PR #$PR: ${has:-ingen}."
          if [ -z "$has" ]; then echo "Slippet rører ekte penger, kontoer, lagret spillerdata eller src/legal/: PR #$PR må ha merkelappen jonas-har-sett, satt av Jonas, før main flyttes."; exit 1; fi
      - name: Migreringene
        env:
          MIG: ${{ inputs.migreringer }}
          NMIG: ${{ steps.what.outputs.nmig }}
          SHA: ${{ steps.what.outputs.sha }}
          GATE_HOST: ${{ secrets.GATE_HOST }}
          GATE_KEY: ${{ secrets.GATE_KEY }}
          GATE_KNOWN_HOSTS: ${{ secrets.GATE_KNOWN_HOSTS }}
          ASK_ID: mig-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ "$NMIG" = 0 ]; then echo "Ingen migreringer i slippet."; exit 0; fi
          if [ "$MIG" = kjørt ]; then echo "Migreringer i slippet: $NMIG, kjørt for hånd."; exit 0; fi
          if [ "$MIG" != hetzner ]; then echo "Slippet har $NMIG migrering(er) (se sammendraget): start med «hetzner», eller kjør dem for hånd og start med «kjørt»."; exit 1; fi
          if [ -z "$GATE_HOST" ] || [ -z "$GATE_KEY" ] || [ -z "$GATE_KNOWN_HOSTS" ]; then echo "::error::GATE_HOST, GATE_KEY og GATE_KNOWN_HOSTS mangler: migreringene kan ikke kjøres fra serveren."; exit 1; fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$GATE_KEY" > ~/.ssh/gate && chmod 600 ~/.ssh/gate
          ssh-keygen -y -f ~/.ssh/gate >/dev/null 2>&1 || { echo "::error::GATE_KEY er ikke en nøkkel ssh kan lese (linjeskiftene har ofte falt bort da den ble limt inn)."; exit 1; }
          printf '%s\n' "$GATE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          R="ssh -i $HOME/.ssh/gate"; H="deploy@$GATE_HOST"
          # only the commit goes up: the server fetches the SQL from GitHub at it and checks it itself (tools/server/gate/migrer.py)
          printf '{"id":"%s","commit":"%s"}\n' "$ASK_ID" "$SHA" > "$RUNNER_TEMP/migrer"
          rsync --inplace --chmod=F644 -e "$R" "$RUNNER_TEMP/migrer" "$H:in/migrer"
          echo "Spurte serveren om migreringene ($ASK_ID, $NMIG fil(er)). Venter på svaret, høyst 15 minutter."
          ok=
          for i in $(seq 1 90); do
            sleep 10
            rm -f "$RUNNER_TEMP/migrer.json"
            rsync -q -e "$R" "$H:out/migrer.json" "$RUNNER_TEMP/migrer.json" 2>/dev/null || continue
            got=$(python3 -c "import json,sys; r=json.load(open(sys.argv[1])); print(r.get('id',''), 'go' if r.get('ok') is True else 'stop')" "$RUNNER_TEMP/migrer.json" 2>/dev/null || true)
            case "$got" in "$ASK_ID go") ok=go; break;; "$ASK_ID stop") ok=stop; break;; esac
          done
          rsync -q -e "$R" "$H:out/migrer-log.txt" "$RUNNER_TEMP/migrer-log.txt" 2>/dev/null && cat "$RUNNER_TEMP/migrer-log.txt" || echo "(ingen logg fra serveren)"
          [ -s "$RUNNER_TEMP/migrer.json" ] && cat "$RUNNER_TEMP/migrer.json" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$ok" = go ]; then echo "Migreringene er kjørt i produksjon fra serveren." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ "$ok" = stop ]; then echo "::error::Serveren stoppet migreringene (grunnen står over): main flyttes ikke."; exit 1; fi
          echo "::error::Serveren svarte ikke på 15 minutter (journalctl -u dsb-migrer på serveren): main flyttes ikke."; exit 1
      - name: main flyttes fram
        id: push
        env:
          SLIPP_KEY: ${{ secrets.SLIPP_KEY }}
          SHA: ${{ steps.what.outputs.sha }}
          OLD: ${{ steps.what.outputs.old }}
          WF: ${{ steps.what.outputs.wf }}
        run: |
          if [ -n "$SLIPP_KEY" ]; then
            install -d -m 700 ~/.ssh
            printf '%s\n' "$SLIPP_KEY" > ~/.ssh/slipp && chmod 600 ~/.ssh/slipp
            ssh-keyscan -t ed25519,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/slipp -o IdentitiesOnly=yes"
            url="git@github.com:${{ github.repository }}.git"; echo "how=key" >> "$GITHUB_OUTPUT"
          else
            url=origin; echo "how=token" >> "$GITHUB_OUTPUT"
            if [ "$WF" = 1 ]; then echo "Slippet endrer .github/workflows/, og workflowens eget token får ikke pushe det. Legg en deploy-nøkkel med skrivetilgang i hemmeligheten SLIPP_KEY (docs/systemer/publisering.md, «Slippet»)."; fi
          fi
          # a fast-forward only: no force, and main must still be where it was when the release was worked out
          # (a plain push: git refuses it when it is not a fast-forward, also if main moved since the release was worked out)
          git push "$url" "$SHA:refs/heads/main"
          echo "main er nå $SHA (før: $OLD)." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Etterpå
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.what.outputs.pr }}
          HOW: ${{ steps.push.outputs.how }}
          OLD: ${{ steps.what.outputs.old }}
        run: |
          # a push with the workflow's token starts no workflow: the production build is started here
          if [ "$HOW" = token ]; then gh workflow run deploy.yml --ref main; echo "«Appen på Hetzner» startet på main."; fi
          if [ -n "$PR" ]; then gh pr edit "$PR" --remove-label jonas-har-sett 2>/dev/null || true; fi
          echo "Tilbakerulling: «Appen på Hetzner» på main med commit $OLD." >> "$GITHUB_STEP_SUMMARY"
      # after a fix released alone, main is merged back into the working branch, so the next release is still a fast-forward
      # (the same change is on both, so the merge changes no file; a push with the token starts no roll-out to the test edition)
      - name: main tilbake i arbeidsgrenen
        if: startsWith(inputs.gren, 'slipp/auto-')
        env:
          SHA: ${{ steps.what.outputs.sha }}
          GREN: ${{ inputs.gren }}
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          W=ccr-5e1ba2f4-pusvyd
          for i in 1 2 3; do
            git fetch -q origin "$W"
            git checkout -q -f -B tilbake "origin/$W"
            if git merge-base --is-ancestor "$SHA" HEAD; then echo "Arbeidsgrenen har alt $SHA."; exit 0; fi
            if ! git merge --no-edit -m "Flett main tilbake etter slippet av $GREN" "$SHA"; then
              git merge --abort || true
              echo "main lot seg ikke flette tilbake i arbeidsgrenen uten konflikt. Rettingen er ute hos spillerne; flett main inn i $W for hånd før neste slipp." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
            fi
            if git push origin "tilbake:$W"; then echo "main er flettet tilbake i $W." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
            sleep 5
          done
          echo "Arbeidsgrenen flyttet seg tre ganger på rad; flett main inn i $W for hånd før neste slipp." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1
