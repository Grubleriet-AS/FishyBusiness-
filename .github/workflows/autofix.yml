# Automatisk retting (02.11.2026; Jonas: «jeg vil ha prosessen så helautomatisert som overhodet mulig»). The feedback routine
# (tools/feilretting/RUTINE.md, before 18.11.2026 tools/feedback/RUTINE.md) opens a PR against the working branch with the label `autofix` when it has fixed an error from the error
# list or a player's feedback. This runs the gate on it (tools/autofix/gate.py: the files a fix may touch, its size, no code that talks
# to other hosts or runs text, and no test red that is green on the working branch), and when it passes, merges the PR and starts the
# deploy (a merge made with this workflow's token does not start the push workflows by itself). Since L1a (10.11.2026) the working
# branch goes to the test edition on test.detstorebla.no. Since 16.11.2026 the fix then goes to the players on detstorebla.no alone,
# at once (the step «Slipper rettingen til spillerne» below; Jonas: «der brukerne er, altså på produksjonsutgaven»). One that cannot
# go alone waits for the next release (tools/release/slipp.py and «Slippet» in tools/plan/RUTINE.md).
# A PR the gate stops gets the label `autofix-stoppet` and a comment with why; it waits for Jonas as before.
# From 18.11.2026 only a fix of risk `lav` (tools/ci/risiko.py: the UI, the stylesheet, tests only added to, docs; at most 150 lines and
# 6 files) passes. Real money, accounts and saved player data, the database and the core mechanics are `hoy` or `middels`: the gate
# stops them with the label `venter-pa-jonas` as well, and Jonas lets one in with one click (he merges the PR). Jonas 18.11.2026:
# «Fjern unntaket som lar automatiske rettinger i ekte penger, Stripe og butikk slippes uten godkjenning» (it stood from 17.11.2026).
# Since 16.11.2026 a fix from a player's feedback goes out the same way as one from the error list (Jonas: «feilrettinger fra brukere
# skal slippes rett til main ... Rettelser må skje kjapt», then «fiks og kjør ut alt du kan»; before, Ø6 funn 8 held them for him).
# The gate is the guard against a «fix» steered by a player's text: the files, the size, no code that talks to other hosts or runs
# text, and the tests. The routine still names the feedback a fix is for in the PR.
# Off switch: the repository variable AUTO_FIX_MERGE set to off (Settings → Secrets and variables → Actions → Variables): then nothing
# runs here and every PR waits for Jonas.
# In parts from 20.11.2026 (Jonas: «Kjør på»): before, one machine ran every covered test on the PR's build and then again on the working
# branch's, one after the other, and a fix in the 3D view (#158) took close to the job's three hours. Now «plan» checks the fix
# (gate.py --lag-plan: the risk, the files, the size, the code) and splits its tests by their measured time (tools/regresjon/deler.py
# fordel) over at most three machines, «tester» runs them side by side (one 3D test at a time on each), one more machine runs only the
# fix's own tests on the working branch (the proof «rød test først»), and «gate» puts it together (gate.py --avgjor): a test red with
# the fix is run on the working branch and again on the PR there, and the first confirmed fault stops it. The steps after it are as before.
# The gate itself is the working branch's copy (in porten/), and the PR's tree is only what it tests: a fix cannot change the gate that
# judges it (before 20.11.2026 the PR's own gate.py and risiko.py ran).
# A trial by hand: «Run workflow» with a PR number runs the gate from the branch it is started on, on that PR, and only prints the
# answer (nothing is merged, labelled, commented or released).
name: Automatisk retting
# pull_request_target (20.11.2026): this file is the working branch's, never the PR's (with pull_request a fix could change the
# workflow that runs its gate). It runs only for PRs from this repository (the plan's condition), which already had the same token.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches: [ccr-5e1ba2f4-pusvyd]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR-nummeret porten prøves på (bare en prøve: ingenting flettes, merkes, kommenteres eller slippes)'
        required: true
# No rights at the top: each job asks for its own. The PR's code (the build and the tests in «tester» and «gate») runs with a token
# that can only read, not kept on the disk (persist-credentials: false); the rights to merge, label, comment and release are only in
# «utfall», after the gate has answered (20.11.2026).
permissions: {}
concurrency:
  group: autofix-${{ github.event.pull_request.number || format('prove-{0}', inputs.pr) }}
  cancel-in-progress: true
env:
  # (GitHub's machines draw SwiftShader slower than the sessions: every test's time limit in tests/run.py twice as long, as regresjon.yml)
  KYST_TIDSFAKTOR: '2'
jobs:
  plan:
    # only the routine's own PRs from this repository, with the label, while the switch is on; or a trial by hand
    if: >-
      github.event_name == 'workflow_dispatch' || (
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AUTO_FIX_MERGE != 'off')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
      base: ${{ steps.pr.outputs.base }}
      porten: ${{ steps.pr.outputs.porten }}
      prove: ${{ steps.pr.outputs.prove }}
      test: ${{ steps.p.outputs.test }}
      deler: ${{ steps.p.outputs.deler }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr }}
          EV_PR: ${{ github.event.pull_request.number }}
          EV_SHA: ${{ github.event.pull_request.head.sha }}
          EV_BASE: ${{ github.base_ref }}
        run: |
          # the commit tested, the branch it goes into, and where the gate itself comes from (the working branch; for a trial, the branch
          # the trial was started on)
          if [ "$EVENT" = workflow_dispatch ]; then
            case "$INPUT_PR" in ''|*[!0-9]*) echo "::error::pr må være et tall"; exit 1;; esac
            read -r sha base head_repo <<< "$(gh api "repos/${{ github.repository }}/pulls/$INPUT_PR" --jq '.head.sha + " " + .base.ref + " " + .head.repo.full_name')"
            # (only PRs from this repository, as the condition above for the PR events: a fork's code is never fetched here)
            [ "$head_repo" = "${{ github.repository }}" ] || { echo "::error::PR #$INPUT_PR kommer fra $head_repo, ikke fra ${{ github.repository }}"; exit 1; }
            { echo "pr=$INPUT_PR"; echo "sha=$sha"; echo "base=$base"; echo "porten=${{ github.sha }}"; echo "prove=true"; } >> "$GITHUB_OUTPUT"
          else
            { echo "pr=$EV_PR"; echo "sha=$EV_SHA"; echo "base=$EV_BASE"; echo "porten=$EV_BASE"; echo "prove=false"; } >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.porten }}
          path: porten
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: p
        run: |
          git fetch -q "https://github.com/${{ github.repository }}.git" "+refs/heads/${{ steps.pr.outputs.base }}:refs/remotes/origin/${{ steps.pr.outputs.base }}"
          python3 porten/tools/autofix/gate.py --lag-plan --repo . --base "origin/${{ steps.pr.outputs.base }}" --out plan.json | tee plan.txt
          python3 -c "import json; P=json.load(open('plan.json')); print('test=' + ('true' if P['test'] and P['deler'] else 'false')); print('deler=' + json.dumps(P['deler'] or [{'navn': 'ingen', 'tester': '', 'base': 'nei'}]))" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json

  tester:
    needs: plan
    if: needs.plan.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        del: ${{ fromJSON(needs.plan.outputs.deler) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.porten }}
          path: porten
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Playwright
        run: pip install playwright==1.63.0 && (python -m playwright install --with-deps chromium || python -m playwright install chromium)   # (apt on the runner can fail; the browser itself is what the job needs)
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: The tests (${{ matrix.del.navn }})
        env:
          NAVN: ${{ matrix.del.navn }}
          TESTER: ${{ matrix.del.tester }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          git fetch -q "https://github.com/${{ github.repository }}.git" "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          if [ "${{ matrix.del.base }}" = ja ]; then
            python3 porten/tools/autofix/gate.py --kjor-base --plan plan.json --repo . --base "origin/$BASE" --out "del-$NAVN.json"
          else
            python3 porten/tools/autofix/gate.py --kjor --tester "$TESTER" --repo . --out "del-$NAVN.json"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: del-${{ matrix.del.navn }}
          path: |
            del-*.json
            tests/out/logs/*.txt
          if-no-files-found: warn

  rode:
    # the tests red on the PR's build, each to be run again on a machine of its own (20.11.2026: on #159 the decision ran three red 3D
    # tests on the working branch and again on the PR one after the other, 93 minutes; now they run side by side, gate.py --rode/--igjen)
    needs: [plan, tester]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      any: ${{ steps.r.outputs.any }}
      deler: ${{ steps.r.outputs.deler }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.porten }}
          path: porten
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - uses: actions/download-artifact@v4
        continue-on-error: true   # (none when every part failed: then there is nothing to run again, and the decision stops the fix)
        with:
          pattern: del-*
          path: art
      - id: r
        run: |
          python3 porten/tools/autofix/gate.py --rode --plan plan.json --dir art --out rode.json
          python3 -c "import json; d=json.load(open('rode.json')); print('any=' + ('true' if d else 'false')); print('deler=' + json.dumps(d or [{'navn': 'ingen', 'test': ''}]))" >> "$GITHUB_OUTPUT"

  igjen:
    # one red test: on the working branch (an old test; red there too is not the fix's) and up to twice more alone on the PR
    needs: [plan, rode]
    if: always() && needs.rode.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        del: ${{ fromJSON(needs.rode.outputs.deler) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.porten }}
          path: porten
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Playwright
        run: pip install playwright==1.63.0 && (python -m playwright install --with-deps chromium || python -m playwright install chromium)
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - name: Again (${{ matrix.del.test }})
        env:
          TEST: ${{ matrix.del.test }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          git fetch -q "https://github.com/${{ github.repository }}.git" "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          python3 porten/tools/autofix/gate.py --igjen "$TEST" --plan plan.json --repo . --base "origin/$BASE" --out "del-igjen-$TEST.json"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: del-${{ matrix.del.navn }}
          path: |
            del-*.json
            tests/out/logs/*.txt
          if-no-files-found: warn

  gate:
    needs: [plan, tester, rode, igjen]
    # (also when a part did not finish: its tests then have no answer, and that stops the fix; a red test whose machine did not finish
    # is run again here, as before 20.11.2026)
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      code: ${{ steps.gate.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.porten }}
          path: porten
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Playwright
        run: pip install playwright==1.63.0 && (python -m playwright install --with-deps chromium || python -m playwright install chromium)
      - uses: actions/download-artifact@v4
        with:
          name: plan
      - uses: actions/download-artifact@v4
        continue-on-error: true   # (none when there were no tests to run)
        with:
          pattern: del-*
          path: art
      - name: Porten
        id: gate
        env:
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          git fetch -q "https://github.com/${{ github.repository }}.git" "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          set +e
          python3 porten/tools/autofix/gate.py --avgjor --plan plan.json --dir art --repo . --base "origin/$BASE" --out gate.json | tee gate.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: porten
          path: |
            gate.json
            gate.txt
      - name: Bare en prøve
        if: needs.plan.outputs.prove == 'true'
        env:
          PR: ${{ needs.plan.outputs.pr }}
          PORTEN: ${{ needs.plan.outputs.porten }}
          CODE: ${{ steps.gate.outputs.code }}
        run: |
          # (a block, not one line: « #» in a plain YAML line starts a comment, and cut this one off inside its quotes 20.11.2026)
          echo "Prøve på PR #$PR med porten fra $PORTEN; svaret over (kode $CODE). Ingenting er flettet, merket, kommentert eller sluppet."

  utfall:
    # what the gate's answer leads to: merge and release (0), or the label and the comment for Jonas (3 and 1). Not for a trial
    needs: [plan, gate]
    if: always() && needs.gate.result == 'success' && needs.plan.outputs.prove != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      # (the gate itself from the working branch for the check against main too: main's own copy is the one of the last release, and
      # before 20.11.2026 it ran every test twice one after the other, 2 h 34 min for #159)
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.porten }}
          path: porten
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Playwright
        if: needs.gate.outputs.code == '0'
        run: pip install playwright==1.63.0 && (python -m playwright install --with-deps chromium || python -m playwright install chromium)
      - uses: actions/download-artifact@v4
        with:
          name: porten
      - name: Fletter inn og ruller ut
        if: needs.gate.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.plan.outputs.pr }}
        run: |
          # the PR must still be at the commit the gate tested
          head=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
          [ "$head" = "${{ needs.plan.outputs.sha }}" ] || { echo "PR-en har fått nye commits; venter på neste kjøring"; exit 0; }
          { echo "Porten slapp rettingen ut: filene, størrelsen, koden og testene holder."; echo; echo '```'; tail -n 3 gate.txt; echo '```'; echo; echo "Flettes inn og rulles ut til testutgaven (test.detstorebla.no) nå; så slippes rettingen alene til spillerne på detstorebla.no når den holder mot deres versjon."; echo; echo "---"; echo "_Automatisk retting (.github/workflows/autofix.yml)_"; } > body.md
          gh pr comment "$PR" --body-file body.md
          gh pr merge "$PR" --squash --delete-branch
          gh workflow run deploy.yml --ref ${{ needs.plan.outputs.base }}
      # Straight to the players (Jonas 16.11.2026: «Jeg vil hovedsaklig at feilrettingen skjer der brukerne er, altså på
      # produksjonsutgaven»; his choice the same day: only the fix, at once). The fix alone is picked onto a branch from main
      # (slipp/auto-<PR>), the gate is run once more there (the working branch's copy of it from 20.11.2026, in porten/, against main: the fix
      # must hold on what the players have, not only on the working branch), and the workflow «Slipp» moves main to it. Nothing else of the working branch goes
      # out. A fix that does not apply to main, or is red there, stays on the test edition and waits for the next release.
      # Off switch: the repository variable AUTO_FIX_SLIPP set to off.
      - name: Slipper rettingen til spillerne
        if: needs.gate.outputs.code == '0' && vars.AUTO_FIX_SLIPP != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.plan.outputs.pr }}
          BASE: ${{ needs.plan.outputs.base }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          sha=$(gh pr view "$PR" --json state,mergeCommit -q 'select(.state == "MERGED") | .mergeCommit.oid')
          [ -n "$sha" ] || { echo "PR-en ble ikke flettet i denne kjøringen; ingenting å slippe."; exit 0; }
          say(){ { echo "$1"; echo; echo "---"; echo "_Automatisk retting (.github/workflows/autofix.yml)_"; } > slipp-body.md; gh pr comment "$PR" --body-file slipp-body.md; }
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin main "$BASE"
          git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch -q origin "$sha"
          br="slipp/auto-$PR"
          git checkout -q -f -B "$br" origin/main
          if ! git cherry-pick -x "$sha" > pick.txt 2>&1; then
            git cherry-pick --abort 2>/dev/null || true
            say "Rettingen ligger på testutgaven, men kunne ikke slippes alene til spillerne: den bygger på noe som ikke er sluppet ennå (den lar seg ikke legge rett på main). Den kommer til detstorebla.no med neste slipp."
            exit 0
          fi
          set +e
          python3 porten/tools/autofix/gate.py --repo . --base origin/main --out gate-main.json > gate-main.txt 2>&1; code=$?
          set -e
          tail -n 20 gate-main.txt
          if [ "$code" != 0 ]; then
            say "Rettingen ligger på testutgaven, men porten stoppet den mot spillernes versjon (main), så den slippes ikke alene. Den kommer til detstorebla.no med neste slipp.

          \`\`\`
          $(tail -n 12 gate-main.txt | head -c 2500)
          \`\`\`"
            exit 0
          fi
          # the emergency brake's lock (live-drift fase 4, tools/server/vakt/brems.py): while https://detstorebla.no/nodbrems.json answers,
          # nothing goes out by itself; Jonas lifts it with a release he starts
          if curl -fsS -o /dev/null "https://detstorebla.no/nodbrems.json?t=$(date +%s)" 2>/dev/null; then
            say "Rettingen ligger på testutgaven, men nødbremsen har stoppet automatiske slipp (https://detstorebla.no/nodbrems.json). Den kommer til detstorebla.no med neste slipp Jonas starter."
            exit 0
          fi
          # the build that goes out, tried where it is served first (live-drift fase 4; Jonas: «Verifisering av nøyaktig det bygget som skal ut
          # (main + rettingen) på test.detstorebla.no/auto/ inkludert oppstartstest og den nye testen før produksjon endres»): built from this
          # branch exactly as deploy.yml builds the production, uploaded to auto/, opened there (tools/release/autoprove.py), and the boot
          # test and the fix's own red-first tests run on the same bytes. Anything that does not hold, and nothing goes out
          stop_auto(){ say "Rettingen ligger på testutgaven, men prøven av bygget på test.detstorebla.no/auto/ holdt ikke ($1), så den slippes ikke alene. Den kommer med neste slipp.

          \`\`\`
          $(tail -n 15 auto.txt 2>/dev/null | head -c 2500)
          \`\`\`"; exit 0; }
          [ -n "$DEPLOY_HOST" ] || stop_auto "DEPLOY_HOST mangler"
          install -d -m 700 ~/.ssh; printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy; printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          { pip install -q requests && KYST_CHANNEL=prod python3 tools/map/game.py && KYST_CHANNEL=prod KYST_PWA=1 node build.mjs; } > auto.txt 2>&1 || stop_auto "bygget"
          rsync -az --delete-after --delay-updates -e "ssh -i $HOME/.ssh/deploy" dist-pwa/ "deploy@$DEPLOY_HOST:auto/" >> auto.txt 2>&1 || stop_auto "opplastingen"
          python3 tools/release/autoprove.py https://test.detstorebla.no/auto/ dist-pwa/version.json >> auto.txt 2>&1 || stop_auto "oppstarten på /auto/"
          names=$(python3 -c "import json; t=json.load(open('gate-main.json')).get('tests', {}); print(' '.join(dict.fromkeys(['boottest'] + (t.get('bevis') or []))))" 2>/dev/null || echo boottest)
          KYST_DIST=dist-pwa python3 tests/run.py smoke $names >> auto.txt 2>&1 || stop_auto "testene på det samme bygget: $names"
          grep -q ' 0 FEIL' auto.txt || stop_auto "testene på det samme bygget: $names"
          git push -f origin "$br"
          gh workflow run slipp.yml --ref "$BASE" -f gren="$br" -f migreringer=ingen
          say "Rettingen holder også mot spillernes versjon, og bygget holdt på test.detstorebla.no/auto/ (oppstarten der, og $names på de samme filene). Den slippes nå alene til detstorebla.no (grenen \`$br\`, workflowen «Slipp»; lagringsporten kjører før opplastingen). main flettes tilbake i arbeidsgrenen etterpå."
      - name: Stoppet eller klar for Jonas
        if: needs.gate.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.plan.outputs.pr }}
        run: |
          # code 3: stopped for its risk alone (middels or hoy), tested and without a fault: ready for Jonas' click (18.11.2026)
          if [ "${{ needs.gate.outputs.code }}" = 3 ]; then
            gh label create venter-pa-jonas --color FBCA04 --description "Klar: middels eller høy risiko, venter på ett klikk fra Jonas" 2>/dev/null || true
            gh pr edit "$PR" --add-label venter-pa-jonas
            { echo "**Venter på deg: rettingen rører noe som bare går ut med ditt klikk** (risiko $(sed -n 's/^risiko: //p' gate.txt | head -1), \`tools/ci/risiko.py\`)."; echo; echo "Ser den riktig ut, trykker du «Merge» på PR-en. Den går da til testutgaven og med neste slipp. Vil du ikke ha den, lukker du PR-en."; echo; echo '```'; head -c 3500 gate.txt; echo '```'; echo; echo "---"; echo "_Automatisk retting (.github/workflows/autofix.yml)_"; } > body.md
          else
            gh label create autofix-stoppet --color B60205 --description "Porten stoppet den automatiske rettingen" 2>/dev/null || true
            gh pr edit "$PR" --add-label autofix-stoppet
            { echo "Porten stoppet den automatiske rettingen. Den venter på Jonas."; echo; echo '```'; head -c 3500 gate.txt; echo '```'; echo; echo "---"; echo "_Automatisk retting (.github/workflows/autofix.yml)_"; } > body.md
          fi
          gh pr comment "$PR" --body-file body.md
          [ "${{ needs.gate.outputs.code }}" = 3 ] || exit 1
