<style>

  --acc:#c98500;--acc-ink:#fff;--blue:#2a78d6;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ghost:#a9b4c0;--grid:#edf1f5;--axis:#cfd8e2;--good:#0a7d3c;--bad:#c8372f;--wash:rgba(42,120,214,.09);--shadow:0 1px 2px rgba(16,40,70,.06),0 6px 18px rgba(16,40,70,.06)}

<body>
<div id="app"></div>
<script>
// The admin dashboard of Det Store Blå (04.10.2026; docs/lansering.md E): only Jonas. He signs in with Supabase Auth and a TOTP
// code (aal2); the numbers come from one call, admin_dashboard() in supabase/migrations/, which refuses anyone else. Nothing secret
// is in this page: the project's address and public key only. Without them, or with ?demo, it shows made-up numbers to see the layout.
const CFG = /*@cloud*/null;
const DEMO = !CFG || !CFG.supabaseUrl || /[?&]demo/.test(location.search);
const $ = s => document.querySelector(s), esc = v => String(v == null ? '–' : v).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[c]);
const nf = (v, d) => v == null || isNaN(v) ? '–' : Number(v).toLocaleString('nb-NO', {maximumFractionDigits:d == null ? 1 : d});
const pct = v => v == null ? '–' : nf(v * 100, 1) + ' %';
// the sign-in is kept for 14 days (Jonas 17.11.2026: «jeg tenker den kan være åpen i sånn 14 dager»): the session in localStorage, so it
// outlives the tab, and the access token renewed with the refresh token before it runs out (Supabase gives an hour; the renewed token keeps
// the second factor, aal2). After 14 days from the code it asks for the password and the code again. Only a session that has passed the
// second factor (t0) is kept; one that stopped after the password is dropped on the next load.
const SES_KEY = 'dsbAdmin', SES_DAYS = 14;
function sesRead(){ try { const s = JSON.parse(localStorage.getItem(SES_KEY) || 'null'); if (s && s.t0 && s.refresh_token && Date.now() - s.t0 < SES_DAYS * 864e5) return s;
  if (s) localStorage.removeItem(SES_KEY); return null; } catch (e){ return null; } }
function sesClear(){ SES = null; try { localStorage.removeItem(SES_KEY); sessionStorage.removeItem(SES_KEY); } catch (e){} }
let SES = sesRead(), DATA = null, TAB = 'status', DAYS = 30;

async function auth(path, body, tok){
  const r = await fetch(CFG.supabaseUrl.replace(/\/$/, '') + '/auth/v1/' + path, {method:body ? 'POST' : 'GET', headers:{'Content-Type':'application/json', apikey:CFG.supabaseAnon, ...(tok ? {Authorization:'Bearer ' + tok} : {})}, body:body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.msg || j.error_description || j.message || ('HTTP ' + r.status)); return j;
}
async function rpc(fn, args){
  await fresh(); const {__retry, ...body} = args || {};
  const r = await fetch(CFG.supabaseUrl.replace(/\/$/, '') + '/rest/v1/rpc/' + fn, {method:'POST', headers:{'Content-Type':'application/json', apikey:CFG.supabaseAnon, Authorization:'Bearer ' + SES.access_token}, body:JSON.stringify(body)});
  if (r.status === 401){ if (!args || !args.__retry){ try { await refresh(true); return rpc(fn, {...args, __retry:1}); } catch (e){} } sesClear(); render(); throw new Error('utlogget'); }
  // a function that returns nothing (admin_feedback_set) answers 204 with an empty body: that is a success, not bad JSON
  const tx = await r.text(); if (!r.ok) throw new Error(tx.slice(0, 200)); return tx ? JSON.parse(tx) : null;
}
// t0: when the second factor was passed (set by mfa); a renewal keeps it, so the 14 days run from the code, not from the last renewal
function keep(s, t0){ s.t0 = t0 || (SES && SES.t0) || 0; if (s.expires_in && !s.expires_at) s.expires_at = Math.floor(Date.now() / 1000) + s.expires_in; SES = s;
  try { if (s.t0) localStorage.setItem(SES_KEY, JSON.stringify(s)); } catch (e){} }
// the token renewed when less than five minutes are left (or when the server said 401); one renewal at a time, and a newer session that
// another tab has saved is taken instead (the refresh token is used once, so two tabs must not both spend it)
let REN = null;
async function refresh(force){ if (REN) return REN;
  REN = (async () => { const o = sesRead(); if (o && SES && o.refresh_token !== SES.refresh_token && o.expires_at > SES.expires_at){ SES = o; if (!force) return; }
    if (!SES || !SES.refresh_token || !SES.t0 || Date.now() - SES.t0 >= SES_DAYS * 864e5) throw new Error('utlogget');
    keep(await auth('token?grant_type=refresh_token', {refresh_token:SES.refresh_token})); })();
  try { await REN; } finally { REN = null; } }
async function fresh(){ if (SES && SES.t0 && (!SES.expires_at || SES.expires_at - Date.now() / 1000 < 300)){ try { await refresh(); } catch (e){ sesClear(); render(); throw e; } } }
addEventListener('storage', e => { if (e.key === SES_KEY){ const o = sesRead(); if (o) SES = o; else if (SES && SES.t0){ SES = null; render(); } } });

// ---------- sign-in: password, then the second factor (enrolled the first time) ----------
function loginView(msg){
  $('#app').innerHTML = '<div id="login"><div class="card"><div class="brand">' + LOGO + '<div><b>Det Store Blå</b><small>Admin</small></div></div><p class="note">Bare for eieren. Logg inn med e-post, passord og totrinnskode.</p>' +
    (msg ? '<p class="warn">' + esc(msg) + '</p>' : '') +
    '<label>E-post</label><input id="em" type="email" autocomplete="username"><label>Passord</label><input id="pw" type="password" autocomplete="current-password">' +
    '<p><button class="p" id="go">Logg inn</button></p></div></div>';
  $('#go').onclick = async () => { try { const s = await auth('token?grant_type=password', {email:$('#em').value, password:$('#pw').value}); keep(s, 0); SES = s; await mfa(); } catch (e){ loginView(e.message); } };
}
async function mfa(){
  const u = await auth('user', null, SES.access_token), f = (u.factors || []).find(x => x.factor_type === 'totp' && x.status === 'verified');
  let id = f && f.id, qr = '';
  if (!id){ const en = await auth('factors', {factor_type:'totp', friendly_name:'Det Store Blå admin ' + Date.now()}, SES.access_token); id = en.id;
    qr = '<p class="note">Første gang: skann koden med en autentiseringsapp (for eksempel Google Authenticator eller 1Password), og skriv inn de seks sifrene.</p><div style="background:#fff;padding:8px;border-radius:8px;width:max-content">' + (en.totp.qr_code.startsWith('data:') ? '<img src="' + en.totp.qr_code + '" width="180" height="180" alt="QR">' : en.totp.qr_code) + '</div><p class="note">Eller skriv inn: <code>' + esc(en.totp.secret) + '</code></p>'; }
  $('#app').innerHTML = '<div id="login"><div class="card"><h1 style="font:600 22px Georgia,serif;margin:0 0 8px">Totrinnskode</h1>' + qr +
    '<label>Kode fra appen</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"><p><button class="p" id="ok">Bekreft</button></p><p class="warn" id="err"></p></div></div>';
  $('#ok').onclick = async () => { try { const ch = await auth('factors/' + id + '/challenge', {}, SES.access_token);
    const s = await auth('factors/' + id + '/verify', {challenge_id:ch.id, code:$('#code').value.trim()}, SES.access_token); keep(s, Date.now()); load(); } catch (e){ $('#err').textContent = e.message; } };
}

// ---------- the numbers ----------
async function load(){
  try { DATA = DEMO ? demo() : await rpc('admin_dashboard', {days:DAYS}); render(); }
  catch (e){ if (SES){ $('#app').innerHTML = '<main><div class="card warn">' + esc(e.message) + '</div><button id="reLogin">Logg inn på nytt</button></main>';
    $('#reLogin').onclick = () => { sesClear(); TR = null; FN = null; render(); }; } }   // (no onclick in the HTML: the page's CSP allows only its own script)
}
const TABS = [['status', 'Status'], ['oversikt', 'Nøkkeltall'], ['trakt', 'Trakt'], ['tid', 'Spilletid'], ['frafall', 'Frafall'], ['bruk', 'Spillbruk'], ['okonomi', 'Økonomi i spillet'], ['penger', 'Penger'], ['teknikk', 'Teknikk'], ['geo', 'Geografi'], ['tilbake', 'Tilbakemeldinger'], ['agent', 'Agent'], ['lansering', 'Lansering'], ['logoer', 'Logoer'], ['navn', 'Brukernavn'], ['avis', 'Kystposten'], ['merker', 'Merker'], ['juks', 'Juks'], ['korr', 'Korrigering'], ['kapplop', 'Kappløp'], ['kommer', 'Kommer'], ['sponsorer', 'Sponsorer'], ['mediekort', 'Mediekort']];
function render(){
  for (const k in CH) delete CH[k];
  if (!DEMO && !SES) return loginView();
  if (!DATA) { $('#app').innerHTML = '<main class="note">Henter …</main>'; return load(); }
  const live = DATA.overview && DATA.overview.active_now != null ? '<span class="live" title="Spillere med en åpen økt nå"><i></i>' + nf(DATA.overview.active_now, 0) + ' spiller nå</span>' : '';
  $('#app').innerHTML = '<div class="shell"><aside class="side"><div class="brand">' + LOGO + '<div><b>Det Store Blå</b><small>Admin</small></div></div>' + navHtml() + '</aside><div class="body">' +
    (DEMO ? '<div class="demo">Demo: tallene er oppdiktet. Med Supabase-nøklene og innlogging vises de ekte.</div>' : '') +
    '<header><span class="ht">' + esc((INTRO[TAB] || [Object.fromEntries(TABS)[TAB] || ''])[0]) + '</span><span class="sp"></span>' + live + '<span class="upd">Oppdatert ' + new Date(DATA.generated).toLocaleTimeString('nb-NO', {hour:'2-digit', minute:'2-digit'}) + '</span>' +
    '<select id="days" aria-label="Periode">' + [1, 7, 30, 90, 365].map(d => '<option value="' + d + '"' + (d === DAYS ? ' selected' : '') + '>' + (d === 1 ? 'Siste døgn' : 'Siste ' + d + ' dager') + '</option>').join('') + '</select>' +
    '<button id="thm" class="ib" title="Lys eller mørk" aria-label="Bytt mellom lys og mørk"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor"/></svg></button>' + (DEMO ? '' : '<button id="out">Logg ut</button>') + '</header><main>' + introHtml(TAB) + (VIEW[TAB] || (() => ''))(DATA) + '</main></div></div>';
  $('#thm').onclick = () => { themeFlip(); };
  helpWire(); chWire();
  $('#days').onchange = e => { DAYS = +e.target.value; DATA = null; TR = null; render(); };
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { TAB = b.dataset.t; render(); scrollTo(0, 0); });
  if ($('#out')) $('#out').onclick = () => { auth('logout', {}, SES.access_token).catch(() => {}); sesClear(); TR = null; FN = null; render(); };
  if (TAB === 'tilbake') fbWire();
  if (TAB === 'agent') agWire();
  if (TAB === 'logoer') lgWire();
  if (TAB === 'lansering') lnWire();
  if (TAB === 'sponsorer') spWire();
  if (TAB === 'mediekort' && $('#mkPrint')) $('#mkPrint').onclick = () => window.print();
  if (TAB === 'navn') nmWire();
  if (TAB === 'juks') jkWire();
  if (TAB === 'korr') krWire();
  if (TAB === 'penger') sgWire();
  if (TAB === 'avis') nwWire();
  if (TAB === 'merker' && $('#acR')) $('#acR').onclick = () => { AC = null; render(); };
  if (TAB === 'okonomi') havWire();
  if (TAB === 'trakt' && $('#fnR')) $('#fnR').onclick = () => { FN = null; TU = null; HBF = null; RGF = null; render(); };
}

const card = (title, body, note) => '<div class="card"><h3>' + title + '</h3>' + body + (note ? '<p class="note">' + note + '</p>' : '') + '</div>';
function bars(obj, fmt){ const e = Object.entries(obj || {}).sort((a, b) => b[1] - a[1]); if (!e.length) return '<p class="note">Ingen data ennå.</p>'; const m = Math.max(...e.map(x => +x[1])) || 1;
  return e.slice(0, 25).map(([k, v]) => '<div class="bar"><span style="min-width:120px">' + esc(k) + '</span><i style="width:' + Math.max(2, 60 * v / m) + '%"></i><em>' + (fmt ? fmt(v) : nf(v, 0)) + '</em></div>').join(''); }
function table(rows, cols){ if (!rows || !rows.length) return '<p class="note">Ingen data ennå.</p>'; return '<table><tr>' + cols.map(c => '<th>' + c[1] + '</th>').join('') + '</tr>' + rows.map(r => '<tr>' + cols.map(c => '<td>' + (c[2] ? c[2](r[c[0]], r) : esc(r[c[0]])) + '</td>').join('') + '</tr>').join('') + '</table>'; }
// the hours a day as a line (17.11.2026: was bars for the hours with dots for the sessions on a second scale); the sessions and players stand in the table under
function daily(d){ if (!d.length) return '<p class="note">Ingen data ennå.</p>';
  return lineChart([{name:'Timer spilt', cls:'s1', v:d.map(x => +x.hours || 0)}], d.map(x => x.day), {tfmt:v => nf(v, 1) + ' t'}) +
    '<p class="note">Snitt ' + nf(d.reduce((a, x) => a + (+x.sessions || 0), 0) / d.length, 0) + ' økter og ' + nf(d.reduce((a, x) => a + (+x.players || 0), 0) / d.length, 0) + ' spillere per dag i perioden.</p>'; }
function heat(hm){ const g = {}; let m = 0; (hm || []).forEach(x => { g[x.dow + ':' + x.hour] = x.hours; m = Math.max(m, x.hours); }); const days = ['Man', 'Tir', 'Ons', 'Tor', 'Fre', 'Lør', 'Søn'];
  let s = '<svg viewBox="0 0 760 200" width="100%">'; for (let d = 1; d <= 7; d++){ s += '<text x="0" y="' + (d * 24 + 4) + '">' + days[d - 1] + '</text>';
    for (let h = 0; h < 24; h++){ const v = g[d + ':' + h] || 0, a = m ? v / m : 0; s += '<rect x="' + (34 + h * 30) + '" y="' + (d * 24 - 12) + '" width="28" height="22" rx="3" class="m1" fill-opacity="' + (0.06 + 0.94 * a).toFixed(2) + '"><title>' + days[d - 1] + ' kl. ' + h + ': ' + nf(v) + ' t</title></rect>'; } }
  for (let h = 0; h < 24; h += 3) s += '<text x="' + (34 + h * 30 + 8) + '" y="196">' + h + '</text>'; return s + '</svg>'; }

  penger: D => { const m = D.money; return sgCard() + hvCard() + '<div class="grid">' + kpi('Inntekt i perioden', nf(m.revenue_nok, 0) + ' kr') + kpi('Betalende', nf(m.payers, 0)) + kpi('ARPU', nf(m.arpu, 2) + ' kr') + kpi('Konvertering', pct(m.conversion)) +
